<!doctype html>
<html lang="{{ ui_lang or 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141822">
  <title>{% block title %}{{ _('AI-Писатель') }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ sv }}">
  <link rel="stylesheet" href="/static/css/components.css?v={{ sv }}">
  <link rel="stylesheet" href="/static/css/screens.css?v={{ sv }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">📘 {{ _('AI-Писатель') }}</div>
    <form method="post" action="/api/ui/language" class="lang-switch">
      <input type="hidden" name="next" value="{{ request.url.path }}">
      <button type="submit" name="lang" value="en"
              class="lang-btn{% if ui_lang == 'en' %} active{% endif %}">en</button>
      <button type="submit" name="lang" value="ru"
              class="lang-btn{% if ui_lang != 'en' %} active{% endif %}">ru</button>
    </form>
  </div>
  <nav>
    <a href="/">{{ _('Старт') }}</a>
    <a href="/pipeline">{{ _('Пайплайн') }}</a>
    <a href="/world">{{ _('Мир') }}</a>
    <a href="/characters">{{ _('Персонажи') }}</a>
    <a href="/structure">{{ _('Структура') }}</a>
    <a href="/outline">{{ _('План') }}</a>
    <a href="/book">{{ _('Книга') }}</a>
    <a href="/help">{{ _('Справка') }}</a>
    <a href="/settings">{{ _('Настройки') }}</a>
  </nav>
  <button type="button" class="nav-burger" id="nav-burger"
          aria-label="Меню" aria-expanded="false">☰</button>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
    <span>v{{ app_version }}</span>
</footer>

<script>window.I18N = {{ i18n_json() | safe }};</script>
<script>
  // Мобильное меню-бургер (стили: components.css, блок «Мобильная адаптация»)
  (function () {
    var burger = document.getElementById('nav-burger');
    if (!burger) return;
    burger.addEventListener('click', function () {
      var open = document.body.classList.toggle('nav-open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.textContent = open ? '✕' : '☰';
    });
    document.querySelectorAll('.topbar nav a').forEach(function (a) {
      a.addEventListener('click', function () {
        document.body.classList.remove('nav-open');
        burger.setAttribute('aria-expanded', 'false');
        burger.textContent = '☰';
      });
    });
  })();
</script>
<script src="/static/js/ui.js?v={{ sv }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
